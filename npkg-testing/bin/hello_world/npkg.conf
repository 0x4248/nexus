name = "hello-world"
version = "0.1.0"
description = "Tiny demo C package that installs /bin/hello-world"

[build]
command = "make -C {package_dir} all"

[stage]
command = "make -C {package_dir} install DESTDIR={stage_dir} PREFIX={prefix}"

[clean]
command = "make -C {package_dir} clean"

[capabilities]
installable = true
cleanable = true